name: E2E CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-e2e:
    name: Image CLI and shell E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run real-image CLI, interactive shell, and config E2E tests
        run: cargo test --test cli_e2e --test shell_e2e --test config_path -- --nocapture
