name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: metaclean-${{ runner.os }}
          path: |
            target/release/metaclean
            target/release/metaclean.exe
          if-no-files-found: error
