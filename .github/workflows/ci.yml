name: Rust CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/metaclean metaclean.ini dist/
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target/release/metaclean.exe dist/
          Copy-Item metaclean.ini dist/
      - name: Upload binaries and adjacent config
        uses: actions/upload-artifact@v4
        with:
          name: metaclean-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
