; true = keep, false = remove.
; EXIF/XMP/IPTC are metadata CONTAINERS. When kept, all their contents are kept.
; When EXIF is removed, orientation and resolution may be reconstructed separately.
; Unknown chunks and unrecognized text may contain private information.
[keep]
exif = false
xmp = false
iptc = false
comments = false
creator = false
copyright = false
software = false
timestamps = false
ai_generation = false
provenance = false
color_profile = true
orientation = true
resolution = true
other_text = true
unknown = true
