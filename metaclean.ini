; true = preserve, false = remove, "text" = replace (supported text fields only).
; A quoted value is ALWAYS text, including "true" and "false".
; The original EXIF/XMP/IPTC containers are removed by default. When a text
; replacement is requested, only the explicitly replaced fields are rebuilt.
; Color, image orientation, resolution and other display-critical data stay.
[keep]
exif = false
xmp = false
iptc = false
comments = false
creator = false
copyright = false
software = false
timestamps = false
ai_generation = false
provenance = false
color_profile = true
orientation = true
resolution = true
other_text = true

; More standardized EXIF/TIFF, PNG text and JPEG APP metadata policies.
; Descriptive content is kept by default; origin/identifying fields are removed.
title = true
description = true
keywords = true
contact = false
gps = false
camera_make = false
camera_model = false
lens = false
device_serial = false
camera_settings = false
image_id = false
rating = true
; JPEG APP0 JFXX preview, APP2 MPF, APP2 FPXR and APP12 Ducky.
; MPF can be display-critical in multi-picture JPEGs, so it is kept.
jpeg_thumbnail = false
mpf = true
flashpix = false
ducky = false
; Recognized optional PNG extension chunks: oFFs, pCAL, sCAL, vpAg.
png_extension = true
unknown = true
