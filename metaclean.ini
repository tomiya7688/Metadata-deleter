; true = preserve, false = remove, "text" = replace (supported text fields only).
; A quoted value is ALWAYS text, including "true" and "false".
; The original EXIF/XMP/IPTC containers are removed by default. When a text
; replacement is requested, only the explicitly replaced fields are rebuilt.
; Color, image orientation, resolution and other display-critical data stay.
[keep]
exif = false
xmp = false
iptc = false
comments = false
creator = false
copyright = false
software = false
timestamps = false
ai_generation = false
provenance = false
color_profile = true
orientation = true
resolution = true
other_text = true
unknown = true
